services:
  - type: web
    name: virtual-betting-arena
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_DIR
        value: /var/data
    disk:
      name: arena-data
      mountPath: /var/data
      sizeGB: 1
